<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Migração de dados — Andreia Pateis (uso interno)</title>
<style>
  body{font-family:sans-serif;background:#0f1c1b;color:#f4ede1;padding:40px;max-width:600px;margin:0 auto;}
  h1{color:#d8a55c;font-size:20px;}
  button{background:#d8a55c;color:#0f1c1b;border:none;padding:14px 24px;font-size:14px;border-radius:4px;cursor:pointer;font-weight:600;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  #log{margin-top:24px;font-size:13px;line-height:1.7;white-space:pre-wrap;background:#000;padding:16px;border-radius:4px;max-height:400px;overflow-y:auto;}
  .ok{color:#8fd98f;}
  .err{color:#e0788f;}
</style>
</head>
<body>
  <h1>⚙️ Migração de produtos para o Firestore</h1>
  <p>Página de uso único (interno, não faz parte do catálogo público). Clique no botão
  abaixo para enviar os 21 produtos do protótipo para o banco de dados Firestore.</p>
  <button id="btnMigrate">Migrar produtos para o Firestore</button>
  <div id="log"></div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, setDoc, collection } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { PRODUCTS_TO_MIGRATE, COLORS_TO_MIGRATE } from './migrate-data.js';

    const btn = document.getElementById('btnMigrate');
    const logEl = document.getElementById('log');
    function log(msg, cls){
      const line = document.createElement('div');
      if(cls) line.className = cls;
      line.textContent = msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      log(`Iniciando migração de ${PRODUCTS_TO_MIGRATE.length} produtos...`);
      let success = 0, failed = 0;

      for(const p of PRODUCTS_TO_MIGRATE){
        if(!p || !p.id){
          log(`⚠ Item vazio ou inválido na lista, pulando...`, 'err');
          continue;
        }
        try{
          await setDoc(doc(db, "produtos", String(p.id)), p);
          success++;
          log(`✔ Produto ${p.id} — ${p.name}`, 'ok');
        } catch(e){
          failed++;
          log(`✘ Erro no produto ${p.id} — ${p.name}: ${e.message}`, 'err');
        }
      }

      try{
        await setDoc(doc(db, "config", "colors"), COLORS_TO_MIGRATE);
        log(`✔ Paleta de cores migrada`, 'ok');
      } catch(e){
        log(`✘ Erro ao migrar cores: ${e.message}`, 'err');
      }

      log(`\nConcluído: ${success} produtos migrados, ${failed} falharam.`);
      btn.disabled = false;
      btn.textContent = 'Migração concluída — pode rodar de novo se precisar';
    });
  </script>
</body>
</html>
