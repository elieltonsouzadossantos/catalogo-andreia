          - { label: "Coral", value: "coral" }
          - { label: "Salmão", value: "salmao" }
          - { label: "Laranja", value: "laranja" }
          - { label: "Terracota alaranjado", value: "terracota-alaranjado" }
          - { label: "Laranja queimado", value: "laranja-queimado" }
          # Amarelos
          - { label: "Amarelo bebê", value: "amarelo-bebe" }
          - { label: "Amarelo pastel", value: "amarelo-pastel" }
          - { label: "Limão", value: "limao" }
          - { label: "Mostarda", value: "mostarda" }
          - { label: "Dourado", value: "dourado" }
          # Verdes
          - { label: "Verde bebê", value: "verde-bebe" }
          - { label: "Menta", value: "menta" }
