        widget: "select"
        multiple: true
        required: false
        options: ["PP", "P", "M", "G", "GG", "Único"]
      - label: "Foto do produto"
        name: "imagem"
        widget: "image"
        required: false
        hint: "Se deixar em branco, o site mostra um ícone de roupa no lugar da foto."
      - label: "Foto com modelo?"
        name: "com_modelo"
        widget: "boolean"
        default: false
        hint: "Ative se a foto mostra uma pessoa vestindo a peça. Deixe desativado se é só a peça isolada (flat lay). Isso mantém o catálogo organizado automaticamente, sem depender da ordem de cadastro."
