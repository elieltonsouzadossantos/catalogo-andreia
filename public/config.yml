          - { label: "Rosé", value: "rose" }
          - { label: "Rosa chiclete", value: "rosa-chiclete" }
          - { label: "Rosa pink", value: "rosa-pink" }
          - { label: "Rosa choque", value: "rosa-choque" }
          - { label: "Fúcsia", value: "fucsia" }
          - { label: "Magenta", value: "magenta" }
          - { label: "Rosa queimado", value: "rosa-queimado" }
